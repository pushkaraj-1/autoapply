<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find Jobs</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1b1f24;
        --muted: #646d78;
        --line: #e3e6ea;
        --soft: #f0f2f5;
        --accent: #0f9d8f;
        --accent-ink: #ffffff;
        --strong: #1a9e5f;
        --possible: #c98200;
        --weak: #8a94a3;
        --bad: #e03e3e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --card: #171b21;
          --text: #e8ebef;
          --muted: #8d96a3;
          --line: #262c35;
          --soft: #1e232b;
          --accent: #2ec4b6;
          --accent-ink: #062421;
          --possible: #e0a83e;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }
      a { color: inherit; }
      button, select, input { font: inherit; color: inherit; }
      button, .button { border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.55; cursor: default; border-color: var(--line); }
      .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }

      nav { display: flex; gap: 4px; margin-bottom: 18px; }
      nav a { text-decoration: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; }
      nav a.on { background: var(--card); color: var(--text); border: 1px solid var(--line); }
      header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
      h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
      .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
      .scan { display: none; }
      .scan.show { display: block; }
      .scan-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; font-weight: 600; }
      .sources { display: flex; flex-wrap: wrap; gap: 6px; }
      .source { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
      .source.running { border-color: var(--accent); }
      .source.running::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1s infinite; }
      .source.error, .source.skipped { color: var(--muted); text-decoration: line-through; }
      @keyframes pulse { 50% { opacity: 0.2; } }
      .bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 10px; }
      .bar div { height: 100%; background: var(--accent); transition: width 0.4s; }
      details.notices { margin-top: 10px; font-size: 12px; color: var(--muted); }

      .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px; }
      .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
      .stat b { display: block; font-size: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .stat span { font-size: 12px; color: var(--muted); }

      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
      .toolbar input[type="search"] { flex: 1; min-width: 220px; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
      .toolbar select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
      .check { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      .chip { font-size: 12px; padding: 4px 11px; border-radius: 999px; }
      .chip b { color: var(--muted); margin-left: 3px; }
      .chip.on { background: var(--text); color: var(--card); border-color: var(--text); }
      .chip.on b { color: inherit; opacity: 0.7; }

      .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
      table { width: 100%; border-collapse: collapse; min-width: 900px; }
      th { position: sticky; top: 0; background: var(--card); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
      th.nosort { cursor: default; }
      td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      tr:last-child td { border-bottom: 0; }
      tr.applied td { opacity: 0.55; }
      tr.applied .title { text-decoration: line-through; }
      tr.is-hidden td { opacity: 0.4; }
      .title { font-weight: 600; }
      .title a { text-decoration: none; }
      .title a:hover { text-decoration: underline; }
      .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .flag { font-size: 11px; color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-radius: 5px; padding: 1px 6px; }
      .score { display: inline-block; min-width: 36px; text-align: center; font-weight: 700; font-size: 12px; padding: 3px 7px; border-radius: 6px; background: var(--soft); color: var(--muted); }
      .score.high { background: color-mix(in srgb, var(--strong) 15%, transparent); color: var(--strong); }
      .score.mid { background: color-mix(in srgb, var(--possible) 15%, transparent); color: var(--possible); }
      .ai { cursor: pointer; border: 0; padding: 0; background: none; }
      .src { font-size: 11px; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
      .apply { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; font-size: 13px; padding: 6px 12px; white-space: nowrap; }
      .row-actions { display: flex; gap: 6px; align-items: center; }
      .queue { font-size: 12px; padding: 5px 9px; white-space: nowrap; }
      .queued { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); text-decoration: none; white-space: nowrap; }
      .queued.submitted { background: color-mix(in srgb, var(--strong) 15%, transparent); color: var(--strong); }
      .queued.needs_you, .queued.unconfirmed { background: color-mix(in srgb, var(--possible) 15%, transparent); color: var(--possible); }
      .queued.failed { color: var(--bad); }
      .icon-btn { border: 0; background: none; padding: 4px 8px; color: var(--muted); font-size: 16px; }
      .icon-btn:hover { color: var(--bad); }
      input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
      .empty { text-align: center; padding: 50px 10px; color: var(--muted); }
      .more { display: block; margin: 14px auto 0; }
      .error { background: #fde8e8; color: #9b1c1c; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }

      .drawer-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10; }
      .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--card); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform 0.25s ease; z-index: 11; display: flex; flex-direction: column; }
      .open .drawer-back { opacity: 1; pointer-events: auto; }
      .open .drawer { transform: none; }
      .drawer-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
      .drawer-head h2 { margin: 0 0 4px; font-size: 19px; }
      .drawer-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .drawer-body { flex: 1; overflow: auto; padding: 18px 22px 30px; }
      .drawer-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 6px; }
      .drawer-body ul { margin: 0; padding-left: 18px; }
      .drawer-body .jd { white-space: pre-wrap; line-height: 1.6; }
      .drawer-body label { display: block; font-weight: 600; margin: 16px 0 6px; }
      .drawer-body textarea { width: 100%; min-height: 150px; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
      .drawer-body .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
      @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="jobs.html" class="on">Find jobs</a><a href="queue.html">Auto apply</a><a href="dashboard.html">Dashboard</a></nav>
      <header>
        <div>
          <h1>Find Jobs</h1>
          <div class="muted" id="subtitle">Loading...</div>
        </div>
        <div class="header-actions">
          <button id="settings-button">Scan settings</button>
          <button class="primary" id="scan">Scan for new jobs</button>
        </div>
      </header>

      <div id="error"></div>

      <section class="card scan" id="scan-card">
        <div class="scan-head"><span id="scan-title"></span><span class="muted small" id="scan-numbers"></span></div>
        <div class="sources" id="scan-sources"></div>
        <details class="notices" id="notices" hidden><summary id="notices-title"></summary><div id="notices-list"></div></details>
      </section>

      <section class="stats" id="stats"></section>

      <div class="toolbar">
        <input type="search" id="search" placeholder="Search role, company or location (press /)" />
        <select id="days" title="Posted within">
          <option value="1">Past 24 hours</option>
          <option value="3">Past 3 days</option>
          <option value="7">Past 7 days</option>
          <option value="10" selected>Past 10 days</option>
        </select>
        <select id="min-fit" title="Fit">
          <option value="0">Any fit</option>
          <option value="45">Fit 45+</option>
          <option value="70">Fit 70+</option>
        </select>
        <label class="check"><input type="checkbox" id="hide-applied" checked /> Hide applied</label>
        <label class="check"><input type="checkbox" id="show-hidden" /> Show hidden</label>
      </div>
      <div class="chips" id="chips"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="nosort" title="Applied">✓</th>
              <th data-sort="fit">Fit</th>
              <th data-sort="title">Role</th>
              <th data-sort="company">Company</th>
              <th data-sort="location">Location</th>
              <th data-sort="source">Source</th>
              <th data-sort="date">Posted</th>
              <th class="nosort"></th>
              <th class="nosort"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <button class="more" id="more" hidden>Show more</button>
    </main>

    <div class="drawer-back" id="drawer-back"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <h2 id="d-title"></h2>
        <div class="muted" id="d-meta"></div>
        <div class="drawer-tools" id="d-tools"></div>
      </div>
      <div class="drawer-body" id="d-body"></div>
    </aside>

    <script src="jobs.js"></script>
  </body>
</html>
