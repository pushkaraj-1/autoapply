[project]
name = "jobautomate"
version = "0.1.0"
description = "Fills job applications from a profile, a resume and an answer pool"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-jobspy>=1.2.0",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
apply = "jobautomate.cli:main"
jobautomate-server = "jobautomate.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobautomate"]
